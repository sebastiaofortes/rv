<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ZenVR - Chuva de Palavras XR</title>
  
  <!-- A-Frame Core -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- Troika Text for better performance -->
  <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
  <!-- XR Components -->
  <script src="./xr-components.js"></script>
  <!-- XR Optimization Guide -->
  <script src="./xr-optimization-guide.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    #playBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #6ac5ff, #4a9fd8);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    #playBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(0,0,0,0.4);
    }

    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      color: white;
      display: none;
    }

    #controls label {
      display: block;
      margin: 10px 0 5px 0;
      font-size: 14px;
    }

    #controls input[type="range"] {
      width: 150px;
    }

    #controls .value {
      display: inline-block;
      width: 40px;
      text-align: right;
      font-weight: bold;
      color: #6ac5ff;
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1em;
      z-index: 10;
      text-align: center;
      display: none;
    }

    #wordStats {
      position: absolute;
      bottom: 80px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      color: #6ac5ff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      display: none;
    }
  </style>
</head>

<body>
  <button id="playBtn">✨ Iniciar Chuva de Palavras</button>

  <div id="controls">
    <label>
      Velocidade: <span class="value" id="speedValue">5</span>s
    </label>
    <input type="range" id="speedSlider" min="2" max="10" value="5" step="0.5">
    
    <label>
      Frequência: <span class="value" id="freqValue">2.1</span>s
    </label>
    <input type="range" id="freqSlider" min="1" max="5" value="2.1" step="0.1">
    
    <label>
      Tamanho: <span class="value" id="sizeValue">0.5</span>
    </label>
    <input type="range" id="sizeSlider" min="0.3" max="1.0" value="0.5" step="0.1">
  </div>

  <div id="instructions">
    ☁️ Observe cada palavra flutuando...<br>
    <small>Deixe-as passar como nuvens no céu</small>
  </div>

  <div id="wordStats">
    <div>Palavras ativas: <span id="activeWords">0</span></div>
    <div>Total mostradas: <span id="totalWords">0</span></div>
  </div>

  <a-scene 
    xr-feature-detector
    xr-performance="targetFps: 72; adaptiveQuality: true"
    meditation-session="duration: 600"
    renderer="colorManagement: true; 
              antialias: true;
              sortObjects: true"
    vr-mode-ui="enabled: true"
    background="color: #20355e">
    
    <a-assets>
      <video 
        id="video360" 
        src="vimeo.mp4" 
        crossorigin="anonymous" 
        loop="true" 
        playsinline 
        webkit-playsinline></video>
    </a-assets>

    <!-- Camera Rig -->
    <a-entity id="cameraRig" position="0 1.6 0">
      <a-camera 
        eye-tracking="enabled: true"
        look-controls="pointerLockEnabled: false"
        wasd-controls="enabled: false">
        
        <!-- Center dot for gaze reference -->
        <a-entity 
          position="0 0 -0.5"
          geometry="primitive: sphere; radius: 0.003"
          material="color: white; shader: flat; opacity: 0.5">
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- 360 Video Background -->
    <a-videosphere 
      src="#video360" 
      rotation="0 -90 0"
      video-360-optimized="useEquirectLayer: true">
    </a-videosphere>

    <!-- Words Container (optimized for performance) -->
    <a-entity id="cloudWords"></a-entity>

    <!-- Ambient environment -->
    <a-entity id="ambientSpheres">
      <!-- Background decorative spheres for depth -->
      <a-sphere position="5 2 -8" radius="0.3" color="#6ac5ff" opacity="0.1" material="transparent: true; shader: flat"></a-sphere>
      <a-sphere position="-6 3 -10" radius="0.4" color="#82bdfa" opacity="0.1" material="transparent: true; shader: flat"></a-sphere>
      <a-sphere position="3 1 -7" radius="0.25" color="#9acfff" opacity="0.1" material="transparent: true; shader: flat"></a-sphere>
    </a-entity>

    <!-- Spatial audio for ambiance -->
    <a-entity 
      position="0 1.6 0"
      spatial-audio-source="src: meditacao.mp3; 
                           loop: true; 
                           volume: 0.4;
                           refDistance: 3;
                           maxDistance: 15">
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.5; color: #7799cc"></a-entity>
    <a-entity light="type: directional; intensity: 0.3; color: #ccddff" position="2 4 -3"></a-entity>

  </a-scene>

  <script>
    // ========== CONFIGURATION ==========
    const palavras = [
      "paz", "calma", "amor", "presença", "aceitação", "gratidão",
      "alegria", "serenidade", "compaixão", "gentileza",
      "ação", "emoção", "inspiração", "razão", "lição",
      "conexão", "coração", "manhã", "amanhã", "união",
      "tensão", "canção", "perdão", "solidão", "percepção",
      "decisão", "admiração", "atenção", "respiração", "meditação",
      "harmonia", "equilíbrio", "leveza", "clareza", "liberdade",
      "consciência", "paciência", "silêncio", "plenitude", "sabedoria"
    ];

    // ========== INITIALIZATION ==========
    const sceneEl = document.querySelector('a-scene');
    const playBtn = document.getElementById('playBtn');
    const controls = document.getElementById('controls');
    const instructions = document.getElementById('instructions');
    const wordStats = document.getElementById('wordStats');
    const video = document.querySelector('#video360');
    const cloudWords = document.getElementById('cloudWords');
    
    let intervalo = null;
    let sessionActive = false;
    let activeWordCount = 0;
    let totalWordCount = 0;
    
    // Settings
    let wordDuration = 5000; // ms
    let spawnFrequency = 2100; // ms
    let wordSize = 0.5;

    // Get video from URL parameter
    const videoParam = getQueryParam('video');
    if (videoParam) {
      video.src = './videos/' + videoParam;
    }

    // ========== APPLY XR OPTIMIZATIONS ==========
    if (window.XROptimizationGuide) {
      XROptimizationGuide.applyAll({
        criticalAssets: [video.src, 'meditacao.mp3'],
        enablePerformanceMonitoring: false
      });
    }

    // ========== WORD CREATION ==========
    function criarNuvemPalavra() {
      // Limit active words for performance
      if (activeWordCount > 20) {
        console.warn('Max active words reached, skipping...');
        return;
      }

      const palavra = palavras[Math.floor(Math.random() * palavras.length)];
      
      // Random position in view frustum
      const spreadX = 3;
      const spreadZ = 2;
      const x = (Math.random() - 0.5) * spreadX;
      const y = 0.5 + Math.random() * 0.5;
      const z = -2 - Math.random() * spreadZ;

      // Create word entity using Troika Text (better performance)
      const entidade = document.createElement('a-troika-text');
      entidade.setAttribute('value', palavra);
      entidade.setAttribute('color', getRandomColor());
      entidade.setAttribute('font-size', wordSize.toString());
      entidade.setAttribute('max-width', '3');
      entidade.setAttribute('anchor', 'center');
      entidade.setAttribute('align', 'center');
      entidade.setAttribute('position', `${x} ${y} ${z}`);
      entidade.setAttribute('opacity', '0');
      entidade.setAttribute('side', 'double');
      
      // Add to scene
      cloudWords.appendChild(entidade);
      activeWordCount++;
      totalWordCount++;
      updateStats();

      // Fade in
      setTimeout(() => {
        entidade.setAttribute('opacity', '1');
      }, 50);

      // Animate
      animateWord(entidade, x, y, z);
    }

    function animateWord(entidade, startX, startY, startZ) {
      let start = null;
      const dur = wordDuration + Math.random() * 1000;
      const targetY = startY + 2.5;
      
      // Random drift
      const driftX = (Math.random() - 0.5) * 0.5;
      const rotationSpeed = (Math.random() - 0.5) * 20;

      function animate(time) {
        if (!start) start = time;
        const elapsed = time - start;
        const progress = elapsed / dur;

        if (progress < 1) {
          // Update position
          const currentY = startY + (targetY - startY) * progress;
          const currentX = startX + driftX * progress;
          entidade.setAttribute('position', `${currentX} ${currentY} ${startZ}`);
          
          // Update opacity (fade out near end)
          const opacity = progress < 0.8 ? 1 : (1 - (progress - 0.8) / 0.2);
          entidade.setAttribute('opacity', Math.max(0, opacity).toString());
          
          // Subtle rotation
          const rotation = rotationSpeed * progress;
          entidade.setAttribute('rotation', `0 ${rotation} 0`);

          requestAnimationFrame(animate);
        } else {
          // Remove word
          if (cloudWords.contains(entidade)) {
            cloudWords.removeChild(entidade);
            activeWordCount--;
            updateStats();
          }
        }
      }
      
      requestAnimationFrame(animate);
    }

    function getRandomColor() {
      const colors = [
        '#82bdfa', '#6ac5ff', '#9acfff', '#b0d4ff', 
        '#7fb3ff', '#a0c4ff', '#c0d9ff'
      ];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    function updateStats() {
      document.getElementById('activeWords').textContent = activeWordCount;
      document.getElementById('totalWords').textContent = totalWordCount;
    }

    // ========== START EXPERIENCE ==========
    playBtn.addEventListener('click', startExperience);

    function startExperience() {
      video.play();
      playBtn.style.display = 'none';
      instructions.style.display = 'block';
      controls.style.display = 'block';
      wordStats.style.display = 'block';
      sessionActive = true;

      // Start spatial audio
      const audioSource = document.querySelector('[spatial-audio-source]');
      if (audioSource && audioSource.components['spatial-audio-source']) {
        audioSource.components['spatial-audio-source'].play();
      }

      // Start word spawning
      criarNuvemPalavra(); // First word immediately
      intervalo = setInterval(criarNuvemPalavra, spawnFrequency);

      // Emit meditation start
      sceneEl.emit('meditation-start');

      console.log('✅ Words experience started');
    }

    // ========== CONTROLS ==========
    document.getElementById('speedSlider').addEventListener('input', (e) => {
      wordDuration = parseFloat(e.target.value) * 1000;
      document.getElementById('speedValue').textContent = e.target.value;
    });

    document.getElementById('freqSlider').addEventListener('input', (e) => {
      spawnFrequency = parseFloat(e.target.value) * 1000;
      document.getElementById('freqValue').textContent = e.target.value;
      
      // Restart interval with new frequency
      if (intervalo) {
        clearInterval(intervalo);
        intervalo = setInterval(criarNuvemPalavra, spawnFrequency);
      }
    });

    document.getElementById('sizeSlider').addEventListener('input', (e) => {
      wordSize = parseFloat(e.target.value);
      document.getElementById('sizeValue').textContent = e.target.value;
    });

    // ========== XR EVENTS ==========
    sceneEl.addEventListener('enter-vr', () => {
      console.log('Entered VR mode');
      controls.style.display = 'none';
    });

    sceneEl.addEventListener('exit-vr', () => {
      console.log('Exited VR mode');
      if (sessionActive) {
        controls.style.display = 'block';
      }
    });

    // ========== SESSION EVENTS ==========
    sceneEl.addEventListener('session-complete', (e) => {
      const duration = e.detail.duration;
      console.log(`Session completed: ${Math.floor(duration / 60)} minutes`);
      
      instructions.innerHTML = `
        🎉 Sessão completa!<br>
        ${totalWordCount} palavras contempladas<br>
        <small>Obrigado por meditar conosco</small>
      `;
      
      // Stop spawning
      if (intervalo) {
        clearInterval(intervalo);
      }
    });

    // ========== PERFORMANCE OPTIMIZATION ==========
    // Cleanup old words if too many accumulate
    setInterval(() => {
      if (activeWordCount > 25) {
        console.warn('Cleaning up excess words');
        const words = cloudWords.children;
        const toRemove = [];
        
        for (let i = 0; i < Math.min(5, words.length); i++) {
          toRemove.push(words[i]);
        }
        
        toRemove.forEach(word => {
          cloudWords.removeChild(word);
          activeWordCount--;
        });
        
        updateStats();
      }
    }, 5000);

    // Memory monitoring
    if (window.XROptimizationGuide) {
      setInterval(() => {
        const needsCleanup = XROptimizationGuide.memoryManagement.monitorMemory();
        if (needsCleanup) {
          console.warn('High memory usage - consider reducing word frequency');
        }
      }, 30000);
    }

    // ========== UTILITY ==========
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // ========== CLEANUP ==========
    window.addEventListener('beforeunload', () => {
      if (intervalo) clearInterval(intervalo);
      if (sessionActive) {
        sceneEl.emit('meditation-end');
      }
      
      // Dispose all words
      while (cloudWords.firstChild) {
        cloudWords.removeChild(cloudWords.firstChild);
      }
    });

    console.log('✅ ZenVR Palavras XR - Ready');
  </script>
</body>

</html>
