<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <!-- A-Frame Core -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <!-- Troika Text -->
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
    <style>
        #playBtn {
            display: none;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 1em;
            z-index: 10;
        }

        /* === Goal Panel === */
        #goalPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            padding: 28px 32px;
            border-radius: 16px;
            z-index: 20;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 340px;
            width: 90%;
        }

        #goalPanel h2 {
            font-size: 1.3em;
            margin: 0 0 16px 0;
            color: #a5b4fc;
        }

        #goalTypeRow {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 14px;
        }

        .goalTypeBtn {
            padding: 8px 16px;
            border: 1px solid rgba(165, 180, 252, 0.4);
            border-radius: 8px;
            background: transparent;
            color: #a5b4fc;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .goalTypeBtn.active {
            background: rgba(79, 70, 229, 0.6);
            border-color: #4F46E5;
            color: #fff;
        }

        #goalValueRow {
            display: none;
            gap: 8px;
            justify-content: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .goalValueBtn {
            padding: 6px 14px;
            border: 1px solid rgba(165, 180, 252, 0.3);
            border-radius: 20px;
            background: transparent;
            color: #c7d2fe;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .goalValueBtn.active {
            background: rgba(59, 130, 246, 0.5);
            border-color: #3B82F6;
            color: #fff;
        }

        #startSessionBtn {
            padding: 14px 36px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s;
        }

        #startSessionBtn:active {
            opacity: 0.8;
        }

        /* === Session HUD === */
        #sessionHud {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: right;
        }

        #timerDisplay {
            background: rgba(0, 0, 0, 0.5);
            color: #e0e7ff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 1.4em;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        #counterDisplay {
            background: rgba(79, 70, 229, 0.5);
            color: #fff;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 1em;
        }

        /* === Completion Overlay === */
        #completionOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 25;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #completionOverlay .completion-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 32px 40px;
            border-radius: 16px;
            text-align: center;
            color: #fff;
            max-width: 360px;
            width: 90%;
        }

        #completionOverlay .completion-box h2 {
            font-size: 1.4em;
            margin: 0 0 8px 0;
            color: #a5b4fc;
        }

        #completionMsg {
            color: #c7d2fe;
            margin: 0 0 20px 0;
            font-size: 0.95em;
        }

        .completion-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        #continueBtn {
            padding: 10px 24px;
            border: 1px solid rgba(165, 180, 252, 0.4);
            border-radius: 8px;
            background: transparent;
            color: #a5b4fc;
            cursor: pointer;
            font-size: 0.95em;
        }

        #finishBtn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <button id="playBtn">Ver Palavras como Nuvens</button>
    <div id="instructions" style="display:none;">
        Palavras vao passar diante de voce, como nuvens. Observe cada uma, e deixe-a ir...
    </div>

    <!-- Goal Panel -->
    <div id="goalPanel">
        <h2>Configurar Sessao</h2>
        <div id="goalTypeRow"></div>
        <div id="goalValueRow"></div>
        <button id="startSessionBtn">Iniciar Meditacao</button>
    </div>

    <!-- Session HUD -->
    <div id="sessionHud">
        <div id="timerDisplay">00:00</div>
        <div id="counterDisplay">
            <span id="counterLabel">Palavras</span>: <span id="counterValue">0</span><span id="counterGoal"></span>
        </div>
    </div>

    <!-- Completion Overlay -->
    <div id="completionOverlay">
        <div class="completion-box">
            <div style="font-size: 2em; margin-bottom: 12px;">&#10024;</div>
            <h2>Sessao Completa</h2>
            <p id="completionMsg"></p>
            <div class="completion-buttons">
                <button id="continueBtn">Continuar</button>
                <button id="finishBtn">Encerrar</button>
            </div>
        </div>
    </div>

    <a-scene background="color: #20355e" session-tick>
        <a-assets>
            <video id="video360" src="vimeo.mp4" crossorigin="anonymous" loop="true" playsinline
                webkit-playsinline></video>
        </a-assets>
        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>
        <a-entity id="cloudWords"></a-entity>

        <!-- VR HUD (painel 3D visivel apenas no modo VR) -->
        <a-entity id="vrHud" visible="false" position="-1.2 1.6 -1.5" rotation="0 30 0">
            <a-plane width="0.7" height="0.4" color="#000" opacity="0.6" side="double"></a-plane>
            <a-text id="vrTimer" value="00:00" position="0 0.08 0.01"
                align="center" color="#e0e7ff" width="2.5"></a-text>
            <a-text id="vrCounter" value="Palavras: 0" position="0 -0.06 0.01"
                align="center" color="#a5b4fc" width="2"></a-text>
        </a-entity>
    </a-scene>
    <script>
        // Lista de palavras com acentos
        const palavras = [
            "paz", "calma", "amor", "presenca", "aceitacao", "gratidao",
            "alegria", "serenidade", "compaixao", "gentileza",
            "acao", "emocao", "inspiracao", "razao", "licao",
            "conexao", "coracao", "manha", "amanha", "uniao",
            "tensao", "cancao", "perdao", "solidao", "percepcao",
            "decisao", "admiracao", "atencao"
        ];
        const videoParam = getQueryParam('video');
        var playBtn = document.getElementById('playBtn');
        var video = document.querySelector('#video360');
        var instructions = document.getElementById('instructions');
        var cloudWords = document.getElementById('cloudWords');
        var intervalo;

        if (videoParam) {
            video.src = './videos/' + videoParam;
        }

        // === SESSION STATE ===
        var sessionActive = false;
        var sessionStartTime = 0;
        var sessionGoalType = 'none';
        var sessionGoalValue = 0;
        var sessionCounter = 0;
        var goalReached = false;

        // === TIMER ===
        function formatTime(seconds) {
            var m = Math.floor(seconds / 60);
            var s = Math.floor(seconds % 60);
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function startSessionTimer() {
            sessionActive = true;
            sessionStartTime = Date.now();
            sessionCounter = 0;
            goalReached = false;
            updateCounterDisplay();
            document.getElementById('sessionHud').style.display = 'block';
            document.getElementById('timerDisplay').textContent = '00:00';
        }

        function stopSessionTimer() {
            sessionActive = false;
        }

        // A-Frame component: runs inside the XR render loop (works in VR)
        AFRAME.registerComponent('session-tick', {
            tick: function () {
                if (!sessionActive) return;
                var elapsed = (Date.now() - sessionStartTime) / 1000;
                var timeStr = formatTime(elapsed);
                document.getElementById('timerDisplay').textContent = timeStr;
                var vrT = document.getElementById('vrTimer');
                if (vrT) vrT.setAttribute('text', 'value', timeStr);

                if (!goalReached && sessionGoalType === 'duration' && elapsed >= sessionGoalValue) {
                    onGoalReached();
                }
            }
        });

        // === COUNTER ===
        function incrementCounter() {
            sessionCounter++;
            updateCounterDisplay();
            if (!goalReached && sessionGoalType === 'words' && sessionCounter >= sessionGoalValue) {
                onGoalReached();
            }
        }

        function updateCounterDisplay() {
            var el = document.getElementById('counterValue');
            if (el) el.textContent = sessionCounter;
            var goalEl = document.getElementById('counterGoal');
            if (goalEl) {
                goalEl.textContent = (sessionGoalType === 'words') ? ' / ' + sessionGoalValue : '';
            }

            // Sync VR HUD
            var vrC = document.getElementById('vrCounter');
            if (vrC) {
                var txt = 'Palavras: ' + sessionCounter;
                if (sessionGoalType === 'words') txt += ' / ' + sessionGoalValue;
                vrC.setAttribute('text', 'value', txt);
            }
        }

        // === SESSION HISTORY ===
        function saveSession(elapsed) {
            try {
                var history = JSON.parse(localStorage.getItem('zenvr_sessions') || '[]');
                history.push({
                    type: 'palavras',
                    duration: Math.round(elapsed),
                    words: sessionCounter,
                    date: new Date().toISOString()
                });
                if (history.length > 200) history = history.slice(-200);
                localStorage.setItem('zenvr_sessions', JSON.stringify(history));
            } catch (e) { /* storage full or unavailable */ }
        }

        // === GOAL COMPLETION ===
        function onGoalReached() {
            goalReached = true;
            var elapsed = (Date.now() - sessionStartTime) / 1000;
            saveSession(elapsed);
            var msg = '';
            if (sessionGoalType === 'duration') {
                msg = 'Voce meditou por ' + formatTime(elapsed) + '.';
            } else if (sessionGoalType === 'words') {
                msg = 'Voce contemplou ' + sessionCounter + ' palavras em ' + formatTime(elapsed) + '.';
            }
            document.getElementById('completionMsg').textContent = msg;
            var overlay = document.getElementById('completionOverlay');
            overlay.style.display = 'flex';

            // Exit VR mode if active
            var scene = document.querySelector('a-scene');
            if (scene && scene.is('vr-mode')) {
                scene.exitVR();
            }
        }

        // === GOAL PANEL ===
        function setupGoalPanel(goalTypes, goalValues) {
            var typeRow = document.getElementById('goalTypeRow');
            var valueRow = document.getElementById('goalValueRow');

            typeRow.innerHTML = '';
            goalTypes.forEach(function (gt, i) {
                var btn = document.createElement('button');
                btn.className = 'goalTypeBtn' + (i === 0 ? ' active' : '');
                btn.dataset.type = gt.key;
                btn.textContent = gt.label;
                btn.addEventListener('click', function () {
                    typeRow.querySelectorAll('.goalTypeBtn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    sessionGoalType = gt.key;
                    renderGoalValues(gt.key, goalValues, valueRow);
                });
                typeRow.appendChild(btn);
            });

            sessionGoalType = 'none';
            renderGoalValues('none', goalValues, valueRow);
        }

        function renderGoalValues(type, goalValues, container) {
            container.innerHTML = '';
            if (type === 'none' || !goalValues[type]) {
                container.style.display = 'none';
                sessionGoalValue = 0;
                return;
            }
            container.style.display = 'flex';
            var options = goalValues[type];
            options.forEach(function (opt, i) {
                var btn = document.createElement('button');
                btn.className = 'goalValueBtn' + (i === 0 ? ' active' : '');
                btn.textContent = opt.label;
                btn.addEventListener('click', function () {
                    container.querySelectorAll('.goalValueBtn').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    sessionGoalValue = opt.value;
                });
                container.appendChild(btn);
            });
            sessionGoalValue = options[0].value;
        }

        // Initialize goal panel
        setupGoalPanel(
            [
                { key: 'none', label: 'Livre' },
                { key: 'words', label: 'Palavras' },
                { key: 'duration', label: 'Tempo' }
            ],
            {
                words: [
                    { value: 20, label: '20' },
                    { value: 50, label: '50' },
                    { value: 100, label: '100' }
                ],
                duration: [
                    { value: 180, label: '3min' },
                    { value: 300, label: '5min' },
                    { value: 600, label: '10min' }
                ]
            }
        );

        // Use troika-text with A-Frame animation (works in VR mode)
        function criarNuvemPalavra() {
            incrementCounter();
            const palavra = palavras[Math.floor(Math.random() * palavras.length)];
            const x = (Math.random() - 0.5) * 2;
            const y = 1 + Math.random() * 0.5;
            const z = -2.4 - Math.random() * 0.3;
            const dur = 5200 + Math.random() * 800;

            const entidade = document.createElement('a-troika-text');
            entidade.setAttribute('value', palavra);
            entidade.setAttribute('color', '#82bdfa');
            entidade.setAttribute('font-size', '0.5');
            entidade.setAttribute('max-width', '2.5');
            entidade.setAttribute('anchor', 'center');
            entidade.setAttribute('position', x + ' ' + y + ' ' + z);
            entidade.setAttribute('opacity', '1');
            entidade.setAttribute('side', 'double');
            entidade.setAttribute('font', 'https://cdn.jsdelivr.net/npm/@fontsource/roboto/files/roboto-latin-400-normal.woff');

            // A-Frame animations: run inside the XR render loop
            entidade.setAttribute('animation__pos', {
                property: 'position',
                to: x + ' ' + (y + 1.9) + ' ' + z,
                dur: dur,
                easing: 'linear'
            });
            entidade.setAttribute('animation__fade', {
                property: 'opacity',
                to: 0,
                dur: dur,
                easing: 'linear'
            });

            // Cleanup when fade animation completes
            entidade.addEventListener('animationcomplete__fade', function () {
                if (cloudWords.contains(entidade)) cloudWords.removeChild(entidade);
            });

            cloudWords.appendChild(entidade);
        }

        // Start session button
        document.getElementById('startSessionBtn').addEventListener('click', function () {
            video.play();
            document.getElementById('goalPanel').style.display = 'none';
            instructions.style.display = 'block';
            criarNuvemPalavra();
            intervalo = setInterval(criarNuvemPalavra, 2100);
            startSessionTimer();
        });

        // Completion handlers
        document.getElementById('continueBtn').addEventListener('click', function () {
            document.getElementById('completionOverlay').style.display = 'none';
        });

        document.getElementById('finishBtn').addEventListener('click', function () {
            document.getElementById('completionOverlay').style.display = 'none';
            var elapsed = (Date.now() - sessionStartTime) / 1000;
            if (!goalReached && elapsed >= 10) saveSession(elapsed);
            clearInterval(intervalo);
            video.pause();
            stopSessionTimer();
            document.getElementById('sessionHud').style.display = 'none';
            document.getElementById('goalPanel').style.display = 'block';
            document.getElementById('counterValue').textContent = '0';
            document.getElementById('timerDisplay').textContent = '00:00';
        });

        window.addEventListener('beforeunload', function () {
            clearInterval(intervalo);
            stopSessionTimer();
        });

        // === VR DUAL RENDERING ===
        var sceneEl = document.querySelector('a-scene');
        if (sceneEl) {
            sceneEl.addEventListener('enter-vr', function () {
                document.getElementById('sessionHud').style.display = 'none';
                document.getElementById('goalPanel').style.display = 'none';
                document.getElementById('instructions').style.display = 'none';
                var vrHud = document.getElementById('vrHud');
                if (vrHud && sessionActive) vrHud.setAttribute('visible', true);
            });

            sceneEl.addEventListener('exit-vr', function () {
                var vrHud = document.getElementById('vrHud');
                if (vrHud) vrHud.setAttribute('visible', false);
                if (sessionActive) {
                    document.getElementById('sessionHud').style.display = 'block';
                    document.getElementById('instructions').style.display = 'block';
                } else {
                    document.getElementById('goalPanel').style.display = 'block';
                }
            });
        }

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
    </script>
</body>

</html>
