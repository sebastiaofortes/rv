<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo 360° XR - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 100;
            font-size: 16px;
            max-width: 90%;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .btn {
            background: rgba(76, 175, 80, 0.9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: rgba(76, 175, 80, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.vr {
            background: rgba(33, 150, 243, 0.9);
        }

        .btn.vr:hover {
            background: rgba(33, 150, 243, 1);
        }

        .btn:disabled {
            background: rgba(128, 128, 128, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        #videoSelector {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }

        #videoSelector select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background: white;
            cursor: pointer;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 99;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            #info {
                font-size: 14px;
                padding: 10px 15px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        🎥 Vídeo 360° com WebXR<br>
        <small>Arraste para olhar ao redor | Use óculos VR para experiência imersiva</small>
    </div>

    <div id="videoSelector">
        <select id="videoSelect">
            <option value="videos/floresta.mp4">🌲 Floresta</option>
            <option value="videos/cachoeira.mp4">💧 Cachoeira</option>
            <option value="videos/mountain.mp4">⛰️ Montanha</option>
            <option value="videos/praia-flores.mp4">🌺 Praia com Flores</option>
            <option value="videos/default.mp4">🌅 Padrão</option>
        </select>
    </div>

    <div id="loading" style="display: none;">
        <div class="spinner"></div>
        Carregando vídeo...
    </div>

    <div id="controls">
        <button id="playPauseBtn" class="btn">▶️ Play</button>
        <button id="muteBtn" class="btn">🔊 Som</button>
        <button id="vrBtn" class="btn vr" style="display: none;">🥽 Entrar em VR</button>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Variáveis globais
        let scene, camera, renderer, videoMesh, video, controls;
        let isPlaying = false;
        let isMuted = false;

        // Elementos DOM
        const container = document.getElementById('container');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const vrBtn = document.getElementById('vrBtn');
        const videoSelect = document.getElementById('videoSelect');
        const loading = document.getElementById('loading');

        // Inicialização
        init();
        animate();

        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Câmera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 0.1);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Controles de órbita (para navegadores não-VR)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.rotateSpeed = -0.5;
            controls.target.set(0, 0, 0);
            controls.update();

            // Criar vídeo
            createVideoSphere();

            // Botão VR
            setupVRButton();

            // Event listeners
            playPauseBtn.addEventListener('click', togglePlayPause);
            muteBtn.addEventListener('click', toggleMute);
            videoSelect.addEventListener('change', changeVideo);
            window.addEventListener('resize', onWindowResize);

            // Tentar autoplay (pode não funcionar em alguns navegadores)
            setTimeout(() => {
                playVideo();
            }, 500);
        }

        function createVideoSphere() {
            // Criar elemento de vídeo
            video = document.createElement('video');
            video.src = videoSelect.value;
            // Removido crossOrigin para evitar problemas CORS com arquivos locais
            video.loop = true;
            video.muted = isMuted;
            video.playsInline = true;
            video.preload = 'auto';
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');

            console.log('Carregando vídeo:', video.src);

            // Geometria esférica invertida (para ver por dentro)
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1); // Inverte para ver por dentro

            // Criar textura DEPOIS que o vídeo estiver pronto
            let videoTexture = null;
            let material = null;

            // Event listeners do vídeo
            video.addEventListener('loadeddata', () => {
                console.log('Vídeo carregado - Dimensões:', video.videoWidth, 'x', video.videoHeight);
                loading.style.display = 'none';

                // Criar textura apenas quando o vídeo estiver pronto
                if (!videoTexture) {
                    videoTexture = new THREE.VideoTexture(video);
                    videoTexture.minFilter = THREE.LinearFilter;
                    videoTexture.magFilter = THREE.LinearFilter;
                    videoTexture.format = THREE.RGBAFormat; // Mudado para RGBA
                    videoTexture.colorSpace = THREE.SRGBColorSpace;
                    videoTexture.needsUpdate = true;

                    console.log('Textura de vídeo criada');

                    // Atualizar material se já existir
                    if (videoMesh && videoMesh.material) {
                        videoMesh.material.map = videoTexture;
                        videoMesh.material.needsUpdate = true;
                    }
                }
            });

            video.addEventListener('play', () => {
                isPlaying = true;
                playPauseBtn.textContent = '⏸️ Pause';
                console.log('Vídeo reproduzindo');
            });

            video.addEventListener('pause', () => {
                isPlaying = false;
                playPauseBtn.textContent = '▶️ Play';
            });

            video.addEventListener('error', (e) => {
                console.error('Erro ao carregar vídeo:', e);
                loading.innerHTML = '<div style="color: red;">Erro ao carregar vídeo</div>';
            });

            // Material com cor de placeholder
            material = new THREE.MeshBasicMaterial({
                color: 0x333333,
                side: THREE.BackSide // Mudado para BackSide (mais correto para esfera invertida)
            });

            // Mesh
            if (videoMesh) {
                scene.remove(videoMesh);
                if (videoMesh.geometry) videoMesh.geometry.dispose();
                if (videoMesh.material) {
                    if (videoMesh.material.map) videoMesh.material.map.dispose();
                    videoMesh.material.dispose();
                }
            }

            videoMesh = new THREE.Mesh(geometry, material);
            videoMesh.rotation.y = Math.PI / 2; // Ajusta rotação inicial
            scene.add(videoMesh);

            console.log('Esfera de vídeo criada');
        }

        async function setupVRButton() {
            console.log('=== Debug WebXR ===');
            console.log('URL:', window.location.href);
            console.log('Protocolo:', window.location.protocol);
            console.log('isSecureContext:', window.isSecureContext);
            
            // Criar indicador de status XR
            const xrStatus = document.createElement('div');
            xrStatus.style.position = 'absolute';
            xrStatus.style.top = '70px';
            xrStatus.style.right = '20px';
            xrStatus.style.background = 'rgba(0, 0, 0, 0.8)';
            xrStatus.style.color = 'white';
            xrStatus.style.padding = '10px 15px';
            xrStatus.style.borderRadius = '8px';
            xrStatus.style.fontSize = '14px';
            xrStatus.style.zIndex = '100';
            xrStatus.style.maxWidth = '300px';
            xrStatus.style.fontFamily = 'monospace';
            container.appendChild(xrStatus);

            // Verificar suporte a WebXR
            if (!('xr' in navigator)) {
                console.log('❌ navigator.xr NÃO existe');
                xrStatus.innerHTML = '❌ WebXR não disponível<br><small>Navegador não suporta XR</small>';
                xrStatus.style.background = 'rgba(255, 0, 0, 0.8)';
                return;
            }

            console.log('✅ navigator.xr existe');

            if (!window.isSecureContext) {
                console.log('⚠️ Contexto NÃO seguro (precisa HTTPS ou localhost)');
                xrStatus.innerHTML = '⚠️ Contexto não seguro<br><small>Use HTTPS ou localhost</small>';
                xrStatus.style.background = 'rgba(255, 165, 0, 0.8)';
            }

            try {
                // Verificar suporte a immersive-vr
                const vrSupported = await navigator.xr.isSessionSupported('immersive-vr');
                console.log('immersive-vr suportado:', vrSupported);

                // Verificar suporte a immersive-ar (Android XR)
                const arSupported = await navigator.xr.isSessionSupported('immersive-ar');
                console.log('immersive-ar suportado:', arSupported);

                if (vrSupported || arSupported) {
                    console.log('✅ Modo imersivo disponível!');
                    
                    const vrButton = VRButton.createButton(renderer);
                    vrButton.style.position = 'absolute';
                    vrButton.style.top = '20px';
                    vrButton.style.right = '20px';
                    vrButton.style.left = 'auto';
                    vrButton.style.transform = 'none';
                    vrButton.style.padding = '15px 25px';
                    vrButton.style.fontSize = '16px';
                    vrButton.style.fontWeight = 'bold';
                    vrButton.style.background = 'rgba(33, 150, 243, 0.9)';
                    vrButton.style.border = 'none';
                    vrButton.style.borderRadius = '8px';
                    vrButton.style.cursor = 'pointer';
                    vrButton.style.zIndex = '101';
                    vrButton.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.3)';
                    vrButton.style.transition = 'all 0.3s';
                    container.appendChild(vrButton);
                    
                    // Adicionar hover effect
                    vrButton.addEventListener('mouseenter', () => {
                        vrButton.style.background = 'rgba(33, 150, 243, 1)';
                        vrButton.style.transform = 'translateY(-2px)';
                        vrButton.style.boxShadow = '0 6px 8px rgba(0, 0, 0, 0.4)';
                    });
                    vrButton.addEventListener('mouseleave', () => {
                        vrButton.style.background = 'rgba(33, 150, 243, 0.9)';
                        vrButton.style.transform = 'none';
                        vrButton.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.3)';
                    });

                    xrStatus.innerHTML = `✅ XR Disponível<br><small>VR: ${vrSupported ? 'Sim' : 'Não'} | AR: ${arSupported ? 'Sim' : 'Não'}</small>`;
                    xrStatus.style.background = 'rgba(76, 175, 80, 0.9)';

                    // Esconder status após 5 segundos
                    setTimeout(() => {
                        xrStatus.style.opacity = '0';
                        xrStatus.style.transition = 'opacity 1s';
                        setTimeout(() => xrStatus.remove(), 1000);
                    }, 5000);
                } else {
                    console.log('❌ Nenhum modo imersivo disponível');
                    xrStatus.innerHTML = '❌ Dispositivo XR não detectado<br><small>Conecte óculos VR/AR</small>';
                    xrStatus.style.background = 'rgba(255, 0, 0, 0.8)';
                }
            } catch (error) {
                console.error('Erro ao verificar XR:', error);
                xrStatus.innerHTML = `❌ Erro XR<br><small>${error.message}</small>`;
                xrStatus.style.background = 'rgba(255, 0, 0, 0.8)';
            }
        }

        function playVideo() {
            const playPromise = video.play();
            
            if (playPromise !== undefined) {
                playPromise
                    .then(() => {
                        console.log('Vídeo iniciado com sucesso');
                    })
                    .catch((error) => {
                        console.log('Autoplay bloqueado:', error);
                        // Não faz nada, usuário precisa clicar em play
                    });
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                video.pause();
            } else {
                playVideo();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            video.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇 Mudo' : '🔊 Som';
        }

        function changeVideo() {
            loading.style.display = 'block';
            const oldVideo = video;
            
            // Pausa o vídeo antigo
            if (oldVideo) {
                oldVideo.pause();
            }

            // Criar nova esfera com novo vídeo
            createVideoSphere();

            // Tenta reproduzir o novo vídeo
            setTimeout(() => {
                playVideo();
            }, 100);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Atualizar controles apenas quando não estiver em VR
            if (!renderer.xr.isPresenting) {
                controls.update();
            }

            // Atualizar textura do vídeo se necessário
            if (videoMesh && videoMesh.material && videoMesh.material.map) {
                videoMesh.material.map.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        // Limpar ao sair
        window.addEventListener('beforeunload', () => {
            if (video) {
                video.pause();
                video.src = '';
            }
        });
    </script>
</body>
</html>
