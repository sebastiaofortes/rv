<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ZenVR - Paisagem 360° XR</title>
  
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="./xr-components.js"></script>
  
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    #loader,
    #errorMsg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 25px 35px;
      border-radius: 15px;
      font-size: 1.3em;
      z-index: 20;
      text-align: center;
    }

    #errorMsg {
      background: #7f2222;
    }

    #playBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    #playBtn:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    #qualitySelector {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 8px;
      color: white;
    }

    #qualitySelector select {
      padding: 8px;
      border-radius: 4px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1em;
      z-index: 10;
      text-align: center;
      max-width: 80%;
    }

    #performanceStats {
      position: absolute;
      bottom: 80px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      color: #4CAF50;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      display: none;
    }

    .controls-panel {
      position: absolute;
      top: 80px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      color: white;
      display: none;
    }

    .controls-panel button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #2196F3;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .controls-panel button:hover {
      background: #1976D2;
    }
  </style>
</head>

<body>
  <div id="loader">⏳ Carregando vídeo 360°...</div>
  <div id="errorMsg" style="display:none;">
    ❌ Erro ao carregar vídeo.<br>
    <small>Verifique sua conexão</small>
  </div>

  <button id="playBtn" style="display:none;">▶️ Iniciar Experiência XR</button>

  <div id="qualitySelector" style="display:none;">
    <label>Qualidade:</label>
    <select id="quality">
      <option value="auto" selected>Auto</option>
      <option value="high">Alta (1.2x)</option>
      <option value="medium">Média (1.0x)</option>
      <option value="low">Baixa (0.8x)</option>
    </select>
  </div>

  <div class="controls-panel" id="controlsPanel">
    <button id="toggleAudio">🔊 Áudio: ON</button>
    <button id="toggleParticles">✨ Partículas: ON</button>
    <button id="toggleStats">📊 Stats: OFF</button>
    <button id="resetView">🔄 Reset View</button>
  </div>

  <div id="instructions" style="display:none;">
    🌍 Mova o dispositivo ou arraste para explorar<br>
    <small>Olhe ao redor e relaxe</small>
  </div>

  <div id="performanceStats">
    <div>FPS: <span id="fpsCounter">--</span></div>
    <div>Quality: <span id="qualityLevel">--</span></div>
    <div>XR Active: <span id="xrStatus">--</span></div>
  </div>

  <a-scene 
    xr-feature-detector
    xr-performance="targetFps: 72; adaptiveQuality: true"
    renderer="colorManagement: true; 
              antialias: true; 
              physicallyCorrectLights: true;
              sortObjects: true"
    vr-mode-ui="enabled: true"
    loading-screen="enabled: false">
    
    <a-assets>
      <video 
        id="video360" 
        src="./videos/default.mp4" 
        crossorigin="anonymous" 
        loop="true" 
        playsinline 
        webkit-playsinline
        preload="metadata"></video>
      
      <audio id="ambientAudio" src="meditacao.mp3" loop preload="auto"></audio>
    </a-assets>

    <!-- Camera Rig -->
    <a-entity id="cameraRig" position="0 1.6 0">
      <a-camera 
        eye-tracking="enabled: true"
        look-controls="pointerLockEnabled: false; touchEnabled: true"
        wasd-controls="enabled: false">
        
        <!-- Cursor for interaction -->
        <a-entity 
          cursor="fuse: false; rayOrigin: mouse"
          position="0 0 -0.5"
          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
          material="color: white; shader: flat; opacity: 0.9"
          raycaster="objects: .interactive; far: 20">
        </a-entity>
      </a-camera>
    </a-entity>

    <!-- Optimized 360 Video -->
    <a-videosphere 
      id="videosphere"
      src="#video360" 
      rotation="0 -90 0"
      video-360-optimized="useEquirectLayer: true"
      material="shader: flat; 
                side: back; 
                npot: true"
      segments-width="64"
      segments-height="64">
    </a-videosphere>

    <!-- Interactive hotspots for points of interest -->
    <a-entity id="hotspots">
      <!-- Hotspot 1 - Info point -->
      <a-entity 
        class="interactive hotspot"
        position="2 1.6 -4"
        gaze-interactive="duration: 1500">
        
        <a-sphere 
          radius="0.15" 
          color="#4CAF50" 
          opacity="0.7"
          material="transparent: true; shader: flat"
          animation="property: scale; 
                     from: 1 1 1; 
                     to: 1.3 1.3 1.3; 
                     dur: 1000; 
                     easing: easeInOutSine; 
                     loop: true; 
                     dir: alternate">
        </a-sphere>
        
        <a-ring 
          radius-inner="0.16" 
          radius-outer="0.20" 
          color="#4CAF50"
          opacity="0.5"
          material="transparent: true; shader: flat; side: double"
          animation="property: rotation; 
                     to: 0 360 0; 
                     dur: 3000; 
                     easing: linear; 
                     loop: true">
        </a-ring>
        
        <a-text 
          value="📍 Ponto de Interesse" 
          align="center" 
          color="#FFFFFF" 
          width="2"
          position="0 0.3 0"
          visible="false"
          class="hotspot-label">
        </a-text>
      </a-entity>

      <!-- Hotspot 2 -->
      <a-entity 
        class="interactive hotspot"
        position="-3 1.6 -3"
        gaze-interactive="duration: 1500">
        
        <a-sphere 
          radius="0.15" 
          color="#2196F3" 
          opacity="0.7"
          material="transparent: true; shader: flat"
          animation="property: scale; 
                     from: 1 1 1; 
                     to: 1.3 1.3 1.3; 
                     dur: 1000; 
                     easing: easeInOutSine; 
                     loop: true; 
                     dir: alternate">
        </a-sphere>
        
        <a-ring 
          radius-inner="0.16" 
          radius-outer="0.20" 
          color="#2196F3"
          opacity="0.5"
          material="transparent: true; shader: flat; side: double"
          animation="property: rotation; 
                     to: 0 360 0; 
                     dur: 3000; 
                     easing: linear; 
                     loop: true">
        </a-ring>
        
        <a-text 
          value="🌟 Respiração Profunda" 
          align="center" 
          color="#FFFFFF" 
          width="2"
          position="0 0.3 0"
          visible="false"
          class="hotspot-label">
        </a-text>
      </a-entity>
    </a-entity>

    <!-- Ambient particles -->
    <a-entity id="particleSystem"></a-entity>

    <!-- Spatial audio source -->
    <a-entity 
      id="audioSource"
      position="0 1.6 0"
      spatial-audio-source="src: meditacao.mp3; 
                           loop: true; 
                           volume: 0.3;
                           refDistance: 5;
                           maxDistance: 20">
    </a-entity>

    <!-- Lighting -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>

  </a-scene>

  <script>
    // ========== INITIALIZATION ==========
    const sceneEl = document.querySelector('a-scene');
    const video = document.querySelector('#video360');
    const loader = document.getElementById('loader');
    const errorMsg = document.getElementById('errorMsg');
    const playBtn = document.getElementById('playBtn');
    const qualitySelector = document.getElementById('qualitySelector');
    const instructions = document.getElementById('instructions');
    const controlsPanel = document.getElementById('controlsPanel');
    const performanceStats = document.getElementById('performanceStats');
    
    let audioEnabled = true;
    let particlesEnabled = true;
    let statsEnabled = false;
    let experienceStarted = false;

    // Get video from URL parameter
    const videoParam = getQueryParam('video');
    if (videoParam) {
      video.src = './videos/' + videoParam;
    }

    // ========== VIDEO LOADING ==========
    video.addEventListener('loadedmetadata', () => {
      console.log('✅ Video metadata loaded');
      loader.innerHTML = '⏳ Preparando experiência...';
    });

    video.addEventListener('canplaythrough', () => {
      console.log('✅ Video ready to play');
      loader.style.display = 'none';
      playBtn.style.display = 'block';
      qualitySelector.style.display = 'block';
    });

    video.addEventListener('error', (e) => {
      console.error('❌ Video error:', e);
      loader.style.display = 'none';
      errorMsg.style.display = 'block';
    });

    // ========== START EXPERIENCE ==========
    playBtn.addEventListener('click', startExperience);

    function startExperience() {
      video.play()
        .then(() => {
          experienceStarted = true;
          playBtn.style.display = 'none';
          instructions.style.display = 'block';
          controlsPanel.style.display = 'block';
          
          // Start spatial audio
          const audioSource = document.querySelector('#audioSource');
          if (audioSource && audioSource.components['spatial-audio-source']) {
            audioSource.components['spatial-audio-source'].play();
          }
          
          // Add particles
          if (particlesEnabled) {
            addAmbientParticles();
          }
          
          // Start performance monitoring
          startPerformanceMonitoring();
          
          console.log('✅ Experience started');
        })
        .catch((err) => {
          console.error('Play error:', err);
          errorMsg.innerHTML = '❌ Erro ao iniciar<br><small>Toque novamente</small>';
          errorMsg.style.display = 'block';
          setTimeout(() => {
            errorMsg.style.display = 'none';
            playBtn.style.display = 'block';
          }, 2000);
        });
    }

    // ========== QUALITY CONTROL ==========
    document.getElementById('quality').addEventListener('change', (e) => {
      const quality = e.target.value;
      const xrPerformance = sceneEl.components['xr-performance'];
      
      if (xrPerformance) {
        let scale;
        switch(quality) {
          case 'high': scale = 1.2; break;
          case 'medium': scale = 1.0; break;
          case 'low': scale = 0.8; break;
          case 'auto':
          default: 
            xrPerformance.data.adaptiveQuality = true;
            return;
        }
        
        xrPerformance.data.adaptiveQuality = false;
        xrPerformance.qualityLevel = scale;
        xrPerformance.optimizeForXR();
        
        console.log(`Quality set to: ${quality} (${scale}x)`);
      }
    });

    // ========== CONTROLS ==========
    document.getElementById('toggleAudio').addEventListener('click', function() {
      audioEnabled = !audioEnabled;
      const audioSource = document.querySelector('#audioSource');
      
      if (audioSource && audioSource.components['spatial-audio-source']) {
        if (audioEnabled) {
          audioSource.components['spatial-audio-source'].play();
          this.textContent = '🔊 Áudio: ON';
        } else {
          audioSource.components['spatial-audio-source'].pause();
          this.textContent = '🔇 Áudio: OFF';
        }
      }
    });

    document.getElementById('toggleParticles').addEventListener('click', function() {
      particlesEnabled = !particlesEnabled;
      const particleSystem = document.getElementById('particleSystem');
      
      if (particlesEnabled) {
        particleSystem.setAttribute('visible', 'true');
        this.textContent = '✨ Partículas: ON';
        if (experienceStarted && particleSystem.children.length === 0) {
          addAmbientParticles();
        }
      } else {
        particleSystem.setAttribute('visible', 'false');
        this.textContent = '✨ Partículas: OFF';
      }
    });

    document.getElementById('toggleStats').addEventListener('click', function() {
      statsEnabled = !statsEnabled;
      performanceStats.style.display = statsEnabled ? 'block' : 'none';
      this.textContent = statsEnabled ? '📊 Stats: ON' : '📊 Stats: OFF';
    });

    document.getElementById('resetView').addEventListener('click', () => {
      const camera = document.querySelector('[camera]');
      if (camera) {
        camera.setAttribute('rotation', '0 0 0');
        camera.setAttribute('position', '0 1.6 0');
        console.log('✅ View reset');
      }
    });

    // ========== PARTICLES ==========
    function addAmbientParticles() {
      const particleSystem = document.getElementById('particleSystem');
      
      // Clear existing particles
      while (particleSystem.firstChild) {
        particleSystem.removeChild(particleSystem.firstChild);
      }
      
      // Create new particles
      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('a-sphere');
        const x = (Math.random() - 0.5) * 15;
        const y = Math.random() * 4;
        const z = (Math.random() - 0.5) * 15;
        const size = 0.02 + Math.random() * 0.04;
        
        particle.setAttribute('radius', size);
        particle.setAttribute('color', '#ffffff');
        particle.setAttribute('opacity', 0.1 + Math.random() * 0.4);
        particle.setAttribute('position', `${x} ${y} ${z}`);
        particle.setAttribute('material', 'shader: flat; transparent: true');
        
        // Floating animation
        const duration = 2000 + Math.random() * 3000;
        particle.setAttribute('animation', {
          property: 'position',
          from: `${x} ${y} ${z}`,
          to: `${x} ${y + 0.5 + Math.random() * 1} ${z}`,
          dur: duration,
          easing: 'easeInOutSine',
          loop: true,
          dir: 'alternate'
        });
        
        particleSystem.appendChild(particle);
      }
      
      console.log('✅ Particles created');
    }

    // ========== HOTSPOT INTERACTION ==========
    const hotspots = document.querySelectorAll('.hotspot');
    hotspots.forEach((hotspot, index) => {
      hotspot.addEventListener('mouseenter', () => {
        const label = hotspot.querySelector('.hotspot-label');
        if (label) {
          label.setAttribute('visible', 'true');
        }
      });
      
      hotspot.addEventListener('mouseleave', () => {
        const label = hotspot.querySelector('.hotspot-label');
        if (label) {
          label.setAttribute('visible', 'false');
        }
      });
      
      hotspot.addEventListener('gaze-activated', () => {
        console.log(`Hotspot ${index + 1} activated`);
        
        // Visual feedback
        const sphere = hotspot.querySelector('a-sphere');
        if (sphere) {
          const originalColor = sphere.getAttribute('color');
          sphere.setAttribute('color', '#FFD700');
          setTimeout(() => {
            sphere.setAttribute('color', originalColor);
          }, 500);
        }
        
        // Haptic feedback
        if (navigator.vibrate) {
          navigator.vibrate([50, 30, 50]);
        }
      });
    });

    // ========== PERFORMANCE MONITORING ==========
    let frameCount = 0;
    let lastTime = performance.now();
    
    function startPerformanceMonitoring() {
      setInterval(() => {
        if (!statsEnabled) return;
        
        const currentTime = performance.now();
        const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
        
        document.getElementById('fpsCounter').textContent = fps;
        
        const xrPerformance = sceneEl.components['xr-performance'];
        if (xrPerformance) {
          document.getElementById('qualityLevel').textContent = 
            (xrPerformance.qualityLevel * 100).toFixed(0) + '%';
        }
        
        document.getElementById('xrStatus').textContent = 
          sceneEl.is('vr-mode') ? 'Yes' : 'No';
        
        frameCount = 0;
        lastTime = currentTime;
      }, 1000);
    }
    
    sceneEl.addEventListener('renderstart', () => {
      frameCount++;
    });

    // ========== XR MODE ==========
    sceneEl.addEventListener('enter-vr', () => {
      console.log('✅ Entered VR mode');
      controlsPanel.style.display = 'none';
      qualitySelector.style.display = 'none';
    });

    sceneEl.addEventListener('exit-vr', () => {
      console.log('✅ Exited VR mode');
      controlsPanel.style.display = 'block';
      qualitySelector.style.display = 'block';
    });

    // ========== UTILITY ==========
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // ========== CLEANUP ==========
    window.addEventListener('beforeunload', () => {
      if (video) video.pause();
    });

    console.log('✅ ZenVR Paisagem XR - Ready');
  </script>
</body>

</html>
