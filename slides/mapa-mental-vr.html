<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Mental VR - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            max-width: 320px;
        }

        #vrButton {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        #vrButton:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateX(-50%) translateY(-2px);
        }

        #nodeInfo {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
            border-left: 4px solid #667eea;
            display: none;
        }

        #nodeInfo h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 20px;
        }

        #nodeInfo.visible {
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 100;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h3 style="margin-bottom: 15px; color: #667eea;">🧠 Mapa Mental VR</h3>
        <p><strong>Controles:</strong></p>
        <p>🖱️ Mouse: Rotacionar câmera</p>
        <p>🖱️ Click: Selecionar nó</p>
        <p>🎯 Scroll: Zoom in/out</p>
        <p>🥽 VR: Use controllers para navegar</p>
        <p style="margin-top: 10px; font-size: 12px; opacity: 0.8;">
            Clique nos nós para ver detalhes!
        </p>
    </div>

    <button id="vrButton">🥽 Entrar em VR</button>

    <div id="nodeInfo">
        <h3 id="nodeTitle">Título do Nó</h3>
        <p id="nodeDescription">Descrição aparece aqui...</p>
    </div>

    <div id="loading">Carregando mapa mental...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuração
        let scene, camera, renderer, controls;
        let nodes = [];
        let connections = [];
        let raycaster, mouse;
        let selectedNode = null;

        // Estrutura do Mapa Mental
        const mindMapData = {
            title: "Three.js & WebXR",
            description: "Desenvolvimento de experiências 3D e realidade virtual na web",
            color: 0x667eea,
            position: { x: 0, y: 0, z: 0 },
            children: [
                {
                    title: "Three.js",
                    description: "Biblioteca JavaScript para criar gráficos 3D no navegador usando WebGL",
                    color: 0x764ba2,
                    angle: 0,
                    distance: 5,
                    children: [
                        {
                            title: "Geometrias",
                            description: "Formas 3D: BoxGeometry, SphereGeometry, PlaneGeometry, etc",
                            color: 0xf093fb,
                            angle: -30,
                            distance: 3
                        },
                        {
                            title: "Materiais",
                            description: "Aparência dos objetos: MeshBasicMaterial, MeshStandardMaterial",
                            color: 0xf093fb,
                            angle: 30,
                            distance: 3
                        },
                        {
                            title: "Iluminação",
                            description: "PointLight, DirectionalLight, SpotLight, AmbientLight",
                            color: 0xf093fb,
                            angle: 60,
                            distance: 3
                        }
                    ]
                },
                {
                    title: "WebXR",
                    description: "API para experiências de Realidade Virtual e Aumentada na web",
                    color: 0x4facfe,
                    angle: 72,
                    distance: 5,
                    children: [
                        {
                            title: "VR Headsets",
                            description: "Meta Quest, HTC Vive, PlayStation VR, etc",
                            color: 0x43e97b,
                            angle: 60,
                            distance: 3
                        },
                        {
                            title: "Controllers",
                            description: "Interação com controles de mão em VR",
                            color: 0x43e97b,
                            angle: 90,
                            distance: 3
                        }
                    ]
                },
                {
                    title: "Animações",
                    description: "Movimento e interatividade com requestAnimationFrame e GSAP",
                    color: 0xfa709a,
                    angle: 144,
                    distance: 5,
                    children: [
                        {
                            title: "Tween",
                            description: "Interpolação suave entre valores",
                            color: 0xfee140,
                            angle: 150,
                            distance: 3
                        }
                    ]
                },
                {
                    title: "Física",
                    description: "Simulação de física com Cannon.js ou Ammo.js",
                    color: 0x30cfd0,
                    angle: 216,
                    distance: 5
                },
                {
                    title: "Performance",
                    description: "Otimização: LOD, instancing, frustum culling",
                    color: 0xff6b6b,
                    angle: 288,
                    distance: 5,
                    children: [
                        {
                            title: "LOD",
                            description: "Level of Detail - diferentes qualidades por distância",
                            color: 0xff8787,
                            angle: 270,
                            distance: 3
                        },
                        {
                            title: "Instancing",
                            description: "Renderizar múltiplas cópias eficientemente",
                            color: 0xff8787,
                            angle: 310,
                            distance: 3
                        }
                    ]
                }
            ]
        };

        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.Fog(0x0a0a1a, 10, 50);

            // Câmera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 5, 15);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);

            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 30;

            // Raycaster para cliques
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Criar mapa mental
            createMindMap(mindMapData);

            // Iluminação
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1, 50);
            pointLight.position.set(0, 10, 10);
            scene.add(pointLight);

            // Grid de referência
            const gridHelper = new THREE.GridHelper(30, 30, 0x333344, 0x222233);
            gridHelper.position.y = -5;
            scene.add(gridHelper);

            // Botão VR
            const vrButton = VRButton.createButton(renderer);
            document.getElementById('vrButton').addEventListener('click', () => {
                vrButton.click();
            });

            // Event listeners
            window.addEventListener('click', onMouseClick);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onWindowResize);

            // Esconder loading
            document.getElementById('loading').classList.add('hidden');

            // Animar
            renderer.setAnimationLoop(animate);
        }

        function createMindMap(data, parentPos = null, parentNode = null) {
            const position = new THREE.Vector3(
                data.position ? data.position.x : 0,
                data.position ? data.position.y : 0,
                data.position ? data.position.z : 0
            );

            // Se tem parent, calcular posição relativa
            if (parentPos && data.angle !== undefined && data.distance !== undefined) {
                const angleRad = (data.angle * Math.PI) / 180;
                position.x = parentPos.x + Math.cos(angleRad) * data.distance;
                position.z = parentPos.z + Math.sin(angleRad) * data.distance;
                position.y = parentPos.y;
            }

            // Criar nó
            const node = createNode(data.title, data.description, data.color, position);
            nodes.push(node);
            scene.add(node);

            // Criar conexão com parent
            if (parentNode) {
                const connection = createConnection(parentNode.position, position, data.color);
                connections.push(connection);
                scene.add(connection);
            }

            // Criar filhos recursivamente
            if (data.children) {
                data.children.forEach(child => {
                    createMindMap(child, position, node);
                });
            }
        }

        function createNode(title, description, color, position) {
            const group = new THREE.Group();

            // Esfera principal
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.3,
                roughness: 0.3,
                metalness: 0.7
            });
            const sphere = new THREE.Mesh(geometry, material);
            group.add(sphere);

            // Anel ao redor
            const ringGeometry = new THREE.TorusGeometry(0.7, 0.05, 16, 100);
            const ringMaterial = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.5
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);

            // Canvas para texto
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 + 15);

            const texture = new THREE.CanvasTexture(canvas);
            const textMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(textMaterial);
            sprite.scale.set(3, 1.5, 1);
            sprite.position.y = 1.2;
            group.add(sprite);

            group.position.copy(position);
            group.userData = { title, description, color, isNode: true };

            return group;
        }

        function createConnection(start, end, color) {
            const points = [];
            points.push(start.clone());
            points.push(end.clone());

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: color,
                opacity: 0.4,
                transparent: true,
                linewidth: 2
            });

            return new THREE.Line(geometry, material);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Highlight ao passar o mouse
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes, true);

            nodes.forEach(node => {
                if (node.children[1]) { // Ring
                    node.children[1].material.emissiveIntensity = 0.5;
                    node.children[0].scale.set(1, 1, 1);
                }
            });

            if (intersects.length > 0) {
                const object = intersects[0].object.parent;
                if (object.userData.isNode) {
                    if (object.children[1]) {
                        object.children[1].material.emissiveIntensity = 1;
                        object.children[0].scale.set(1.2, 1.2, 1.2);
                    }
                    document.body.style.cursor = 'pointer';
                } else {
                    document.body.style.cursor = 'default';
                }
            } else {
                document.body.style.cursor = 'default';
            }
        }

        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes, true);

            if (intersects.length > 0) {
                const object = intersects[0].object.parent;
                if (object.userData.isNode) {
                    selectNode(object);
                }
            }
        }

        function selectNode(node) {
            // Desselecionar anterior
            if (selectedNode && selectedNode.children[0]) {
                selectedNode.children[0].material.emissiveIntensity = 0.3;
            }

            selectedNode = node;

            // Destacar selecionado
            if (node.children[0]) {
                node.children[0].material.emissiveIntensity = 0.8;
            }

            // Mostrar informações
            document.getElementById('nodeTitle').textContent = node.userData.title;
            document.getElementById('nodeDescription').textContent = node.userData.description;
            document.getElementById('nodeInfo').classList.add('visible');

            // Animar câmera para o nó
            const targetPos = node.position.clone();
            const distance = 5;
            const newCameraPos = new THREE.Vector3(
                targetPos.x,
                targetPos.y + 3,
                targetPos.z + distance
            );

            animateCameraTo(newCameraPos, targetPos);
        }

        function animateCameraTo(targetPosition, lookAtPosition) {
            const startPos = camera.position.clone();
            const startLookAt = controls.target.clone();
            const duration = 1000;
            const startTime = performance.now();

            function animate() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                camera.position.lerpVectors(startPos, targetPosition, eased);
                controls.target.lerpVectors(startLookAt, lookAtPosition, eased);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            controls.update();

            // Animar anéis girando
            const time = performance.now() * 0.001;
            nodes.forEach(node => {
                if (node.children[1]) {
                    node.children[1].rotation.z = time;
                }
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
