<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galáxia de Conteúdo VR - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(10, 10, 30, 0.9);
            padding: 20px;
            border-radius: 15px;
            font-size: 14px;
            z-index: 100;
            max-width: 350px;
            border: 2px solid rgba(100, 150, 255, 0.5);
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
        }

        #info h3 {
            color: #6496ff;
            margin-bottom: 12px;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(100, 150, 255, 0.8);
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(102, 126, 234, 0.6);
        }

        #planetInfo {
            position: absolute;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            color: white;
            background: rgba(10, 10, 30, 0.95);
            padding: 30px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            max-width: 400px;
            border: 2px solid rgba(100, 150, 255, 0.6);
            box-shadow: 0 0 40px rgba(100, 150, 255, 0.5);
            display: none;
        }

        #planetInfo h2 {
            color: #6496ff;
            margin-bottom: 15px;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(100, 150, 255, 0.8);
        }

        #planetInfo .category {
            color: #a0c0ff;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 16px;
        }

        #planetInfo .description {
            line-height: 1.8;
            margin-top: 15px;
            color: #e0e0e0;
        }

        #planetInfo.visible {
            display: block;
            animation: fadeInRight 0.4s ease;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateY(-50%) translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateY(-50%) translateX(0);
            }
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6496ff;
            font-size: 28px;
            z-index: 100;
            text-shadow: 0 0 20px rgba(100, 150, 255, 0.8);
        }

        .hidden {
            display: none;
        }

        #stats {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: white;
            background: rgba(10, 10, 30, 0.8);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            border: 1px solid rgba(100, 150, 255, 0.3);
        }

        #stats div {
            margin: 5px 0;
        }

        .highlight {
            color: #6496ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h3>🌌 Galáxia de Conteúdo</h3>
        <p><strong>Controles:</strong></p>
        <p>🖱️ <strong>Mouse:</strong> Rotacionar câmera</p>
        <p>🎯 <strong>Click:</strong> Selecionar planeta</p>
        <p>🔍 <strong>Scroll:</strong> Zoom in/out</p>
        <p>🥽 <strong>VR:</strong> Olhe e selecione planetas</p>
        <p style="margin-top: 15px; font-size: 12px; opacity: 0.9;">
            ✨ Explore o universo de informações!
        </p>
    </div>

    <div id="controls">
        <button id="resetBtn" class="btn">🔄 Resetar Câmera</button>
        <button id="vrButton" class="btn">🥽 Entrar em VR</button>
    </div>

    <div id="planetInfo">
        <h2 id="planetTitle">Planeta</h2>
        <p class="category" id="planetCategory">Categoria</p>
        <p class="description" id="planetDescription">Descrição...</p>
    </div>

    <div id="stats">
        <div>Planetas: <span class="highlight" id="planetCount">0</span></div>
        <div>Estrelas: <span class="highlight" id="starCount">0</span></div>
        <div>Distância: <span class="highlight" id="cameraDistance">0</span>u</div>
    </div>

    <div id="loading">Gerando galáxia...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuração
        let scene, camera, renderer, controls;
        let raycaster, mouse;
        let planets = [];
        let stars;
        let nucleus;
        let selectedPlanet = null;

        // Dados dos planetas
        const planetsData = [
            {
                name: "Three.js Core",
                category: "Fundamentos",
                description: "O coração do Three.js. Geometrias, materiais, luzes e câmeras formam a base de qualquer cena 3D.",
                color: 0x4287f5,
                size: 1.2,
                orbitRadius: 10,
                orbitSpeed: 0.3
            },
            {
                name: "WebXR API",
                category: "Realidade Virtual",
                description: "Portal para mundos virtuais. Crie experiências imersivas que funcionam em qualquer headset VR.",
                color: 0xf54242,
                size: 1.0,
                orbitRadius: 15,
                orbitSpeed: 0.25
            },
            {
                name: "Shaders",
                category: "Gráficos Avançados",
                description: "A linguagem dos pixels. GLSL permite criar efeitos visuais impossíveis com técnicas tradicionais.",
                color: 0x42f554,
                size: 0.9,
                orbitRadius: 12,
                orbitSpeed: 0.28
            },
            {
                name: "Física",
                category: "Simulação",
                description: "Gravidade, colisões e movimento. Cannon.js e Ammo.js trazem realismo físico para o mundo virtual.",
                color: 0xf5d442,
                size: 1.1,
                orbitRadius: 18,
                orbitSpeed: 0.22
            },
            {
                name: "Animações",
                category: "Movimento",
                description: "Vida através do movimento. Tweens, keyframes e interpolação criam transições suaves e naturais.",
                color: 0xf542d4,
                size: 0.95,
                orbitRadius: 14,
                orbitSpeed: 0.26
            },
            {
                name: "Texturas",
                category: "Materiais",
                description: "Superfícies realistas. De madeira a metal, texturas transformam formas simples em objetos convincentes.",
                color: 0x42f5f5,
                size: 0.85,
                orbitRadius: 16,
                orbitSpeed: 0.24
            },
            {
                name: "Performance",
                category: "Otimização",
                description: "Velocidade é essencial. LOD, instancing e frustum culling mantêm 60 FPS mesmo em cenas complexas.",
                color: 0xff6b35,
                size: 1.0,
                orbitRadius: 20,
                orbitSpeed: 0.20
            },
            {
                name: "Post-Processing",
                category: "Efeitos Visuais",
                description: "Magia cinematográfica. Bloom, DOF e color grading adicionam profundidade e atmosfera.",
                color: 0xa742f5,
                size: 0.8,
                orbitRadius: 11,
                orbitSpeed: 0.29
            },
            {
                name: "Modelos 3D",
                category: "Assets",
                description: "Objetos complexos. GLTF/GLB permite importar modelos detalhados de Blender, Maya e outras ferramentas.",
                color: 0xf5a742,
                size: 0.9,
                orbitRadius: 13,
                orbitSpeed: 0.27
            },
            {
                name: "Audio Espacial",
                category: "Som 3D",
                description: "Som posicional. Web Audio API cria experiências auditivas imersivas que seguem objetos no espaço.",
                color: 0x42a7f5,
                size: 0.75,
                orbitRadius: 17,
                orbitSpeed: 0.23
            }
        ];

        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000510);
            scene.fog = new THREE.FogExp2(0x000510, 0.005);

            // Câmera
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 30, 50);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);

            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 150;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // Raycaster
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Criar galáxia
            createNucleus();
            createStarField();
            createPlanets();
            createOrbits();

            // Iluminação
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);

            // Botão VR
            const vrButton = VRButton.createButton(renderer);
            document.getElementById('vrButton').addEventListener('click', () => {
                vrButton.click();
            });

            // Event listeners
            setupEventListeners();

            // Stats
            document.getElementById('planetCount').textContent = planetsData.length;
            document.getElementById('starCount').textContent = '5000+';

            // Esconder loading
            document.getElementById('loading').classList.add('hidden');

            // Animar
            renderer.setAnimationLoop(animate);
        }

        function createNucleus() {
            // Núcleo central brilhante
            const nucleusGeometry = new THREE.SphereGeometry(3, 64, 64);
            const nucleusMaterial = new THREE.MeshBasicMaterial({
                color: 0x6496ff,
                emissive: 0x6496ff,
                emissiveIntensity: 1
            });
            nucleus = new THREE.Mesh(nucleusGeometry, nucleusMaterial);
            scene.add(nucleus);

            // Brilho ao redor do núcleo
            const glowGeometry = new THREE.SphereGeometry(4, 32, 32);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: 0x6496ff,
                transparent: true,
                opacity: 0.3,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeometry, glowMaterial);
            nucleus.add(glow);

            // Luz pontual no núcleo
            const nucleusLight = new THREE.PointLight(0x6496ff, 2, 100);
            nucleusLight.position.set(0, 0, 0);
            scene.add(nucleusLight);

            // Partículas ao redor do núcleo
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 1000;
            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 4 + Math.random() * 2;
                posArray[i * 3] = Math.cos(angle) * radius;
                posArray[i * 3 + 1] = (Math.random() - 0.5) * 2;
                posArray[i * 3 + 2] = Math.sin(angle) * radius;
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.1,
                color: 0x6496ff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            nucleus.add(particlesMesh);
        }

        function createStarField() {
            const starsGeometry = new THREE.BufferGeometry();
            const starCount = 5000;
            const positions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 400;
                positions[i + 1] = (Math.random() - 0.5) * 400;
                positions[i + 2] = (Math.random() - 0.5) * 400;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }

        function createPlanets() {
            planetsData.forEach((data, index) => {
                const planet = createPlanet(data);
                planets.push(planet);
                scene.add(planet);
            });
        }

        function createPlanet(data) {
            const group = new THREE.Group();

            // Planeta
            const planetGeometry = new THREE.SphereGeometry(data.size, 32, 32);
            const planetMaterial = new THREE.MeshStandardMaterial({
                color: data.color,
                emissive: data.color,
                emissiveIntensity: 0.4,
                roughness: 0.7,
                metalness: 0.3
            });
            const planetMesh = new THREE.Mesh(planetGeometry, planetMaterial);
            group.add(planetMesh);

            // Anel ao redor
            const ringGeometry = new THREE.TorusGeometry(data.size * 1.4, 0.05, 16, 100);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.6
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            group.add(ring);

            // Brilho
            const glowGeometry = new THREE.SphereGeometry(data.size * 1.3, 16, 16);
            const glowMaterial = new THREE.MeshBasicMaterial({
                color: data.color,
                transparent: true,
                opacity: 0.2,
                side: THREE.BackSide
            });
            const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
            group.add(glowMesh);

            // Label
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#' + data.color.toString(16).padStart(6, '0');
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(data.name, canvas.width / 2, 40);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(4, 1, 1);
            sprite.position.y = data.size + 1.5;
            group.add(sprite);

            // Luz pontual
            const light = new THREE.PointLight(data.color, 0.5, 10);
            group.add(light);

            // Dados do planeta
            group.userData = {
                ...data,
                isPlanet: true,
                angle: Math.random() * Math.PI * 2,
                orbitSpeed: data.orbitSpeed,
                orbitRadius: data.orbitRadius
            };

            return group;
        }

        function createOrbits() {
            planetsData.forEach(data => {
                const orbitGeometry = new THREE.BufferGeometry();
                const points = [];
                const segments = 128;

                for (let i = 0; i <= segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    points.push(new THREE.Vector3(
                        Math.cos(angle) * data.orbitRadius,
                        0,
                        Math.sin(angle) * data.orbitRadius
                    ));
                }

                orbitGeometry.setFromPoints(points);

                const orbitMaterial = new THREE.LineBasicMaterial({
                    color: data.color,
                    transparent: true,
                    opacity: 0.2
                });

                const orbit = new THREE.Line(orbitGeometry, orbitMaterial);
                scene.add(orbit);
            });
        }

        function setupEventListeners() {
            window.addEventListener('click', onPlanetClick);
            window.addEventListener('mousemove', onMouseMove);

            document.getElementById('resetBtn').addEventListener('click', () => {
                camera.position.set(0, 30, 50);
                controls.target.set(0, 0, 0);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // Highlight ao passar mouse
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planets, true);

            planets.forEach(planet => {
                if (planet.children[2]) { // Glow
                    planet.children[2].material.opacity = 0.2;
                }
                planet.children[0].scale.set(1, 1, 1);
            });

            if (intersects.length > 0) {
                const planet = intersects[0].object.parent;
                if (planet.userData.isPlanet) {
                    if (planet.children[2]) {
                        planet.children[2].material.opacity = 0.5;
                    }
                    planet.children[0].scale.set(1.2, 1.2, 1.2);
                    document.body.style.cursor = 'pointer';
                }
            } else {
                document.body.style.cursor = 'default';
            }
        }

        function onPlanetClick() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planets, true);

            if (intersects.length > 0) {
                const planet = intersects[0].object.parent;
                if (planet.userData.isPlanet) {
                    selectPlanet(planet);
                }
            }
        }

        function selectPlanet(planet) {
            selectedPlanet = planet;

            // Mostrar informações
            document.getElementById('planetTitle').textContent = planet.userData.name;
            document.getElementById('planetCategory').textContent = planet.userData.category;
            document.getElementById('planetDescription').textContent = planet.userData.description;
            document.getElementById('planetInfo').classList.add('visible');

            // Animar câmera
            const targetPos = planet.position.clone();
            const distance = planet.userData.size * 6;
            const newCameraPos = new THREE.Vector3(
                targetPos.x + distance,
                targetPos.y + distance * 0.5,
                targetPos.z + distance
            );

            animateCameraTo(newCameraPos, targetPos);

            setTimeout(() => {
                document.getElementById('planetInfo').classList.remove('visible');
            }, 10000);
        }

        function animateCameraTo(targetPosition, lookAtPosition) {
            const startPos = camera.position.clone();
            const startLookAt = controls.target.clone();
            const duration = 1500;
            const startTime = performance.now();

            controls.autoRotate = false;

            function animate() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = easeInOutCubic(progress);

                camera.position.lerpVectors(startPos, targetPosition, eased);
                controls.target.lerpVectors(startLookAt, lookAtPosition, eased);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    setTimeout(() => {
                        controls.autoRotate = true;
                    }, 5000);
                }
            }
            animate();
        }

        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        const clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();

            // Rotação do núcleo
            if (nucleus) {
                nucleus.rotation.y += 0.001;
                nucleus.children[1].rotation.y += 0.01; // Partículas
            }

            // Movimento das estrelas
            if (stars) {
                stars.rotation.y += 0.0002;
            }

            // Órbita dos planetas
            planets.forEach(planet => {
                planet.userData.angle += planet.userData.orbitSpeed * delta;
                planet.position.x = Math.cos(planet.userData.angle) * planet.userData.orbitRadius;
                planet.position.z = Math.sin(planet.userData.angle) * planet.userData.orbitRadius;

                // Rotação própria
                planet.rotation.y += delta * 0.5;

                // Animar anel
                if (planet.children[1]) {
                    planet.children[1].rotation.z += delta;
                }
            });

            // Atualizar stats
            const distance = camera.position.distanceTo(new THREE.Vector3(0, 0, 0));
            document.getElementById('cameraDistance').textContent = distance.toFixed(1);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
