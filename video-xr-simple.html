<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeo 360° XR - Versão Simples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 100;
            font-size: 16px;
            max-width: 90%;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 20px;
        }

        .btn {
            background: rgba(76, 175, 80, 0.9);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: rgba(76, 175, 80, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        #videoSelector {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }

        #videoSelector select {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background: white;
            cursor: pointer;
        }

        #debugInfo {
            position: absolute;
            top: 180px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: lime;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 5px;
            z-index: 100;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        🎥 Vídeo 360° com WebXR<br>
        <small>Arraste para olhar ao redor</small>
    </div>

    <div id="videoSelector">
        <select id="videoSelect">
            <option value="videos/floresta.mp4">🌲 Floresta</option>
            <option value="videos/cachoeira.mp4">💧 Cachoeira</option>
            <option value="videos/mountain.mp4">⛰️ Montanha</option>
            <option value="videos/praia-flores.mp4">🌺 Praia com Flores</option>
            <option value="videos/default.mp4">🌅 Padrão</option>
        </select>
    </div>

    <div id="debugInfo">Iniciando...</div>

    <div id="controls">
        <button id="playPauseBtn" class="btn">▶️ Play</button>
        <button id="muteBtn" class="btn">🔊 Som</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Debug
        const debugDiv = document.getElementById('debugInfo');
        function log(msg) {
            console.log(msg);
            debugDiv.innerHTML += '<br>' + msg;
        }

        // Variáveis globais
        let scene, camera, renderer, controls;
        let video, videoTexture, videoMesh;
        let isPlaying = false;
        let isMuted = false;

        // Elementos DOM
        const container = document.getElementById('container');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const videoSelect = document.getElementById('videoSelect');

        // Inicialização
        init();

        function init() {
            log('Iniciando Three.js...');

            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // Câmera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 0.1);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            log('Renderer criado');

            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.rotateSpeed = -0.5;
            controls.update();

            // Criar vídeo
            video = document.createElement('video');
            video.loop = true;
            video.muted = isMuted;
            video.playsInline = true;
            video.preload = 'auto';
            video.style.display = 'none';
            document.body.appendChild(video);

            log('Elemento de vídeo criado');

            // Event listeners do vídeo
            video.addEventListener('loadedmetadata', () => {
                log(`Metadata carregada: ${video.videoWidth}x${video.videoHeight}`);
            });

            video.addEventListener('loadeddata', () => {
                log('Vídeo pronto para reproduzir');
                createVideoSphere();
            });

            video.addEventListener('error', (e) => {
                log('ERRO: ' + e.message);
            });

            // Carregar vídeo inicial
            video.src = videoSelect.value;
            video.load();

            // Event listeners
            playPauseBtn.addEventListener('click', togglePlayPause);
            muteBtn.addEventListener('click', toggleMute);
            videoSelect.addEventListener('change', changeVideo);
            window.addEventListener('resize', onWindowResize);

            // Botão VR
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                    if (supported) {
                        const vrButton = VRButton.createButton(renderer);
                        // Posicionar no topo direito
                        vrButton.style.position = 'absolute';
                        vrButton.style.top = '20px';
                        vrButton.style.right = '20px';
                        vrButton.style.left = 'auto';
                        vrButton.style.bottom = 'auto';
                        vrButton.style.transform = 'none';
                        vrButton.style.padding = '15px 25px';
                        vrButton.style.fontSize = '16px';
                        vrButton.style.fontWeight = 'bold';
                        vrButton.style.background = 'rgba(33, 150, 243, 0.9)';
                        vrButton.style.border = 'none';
                        vrButton.style.borderRadius = '8px';
                        vrButton.style.cursor = 'pointer';
                        vrButton.style.zIndex = '101';
                        vrButton.style.boxShadow = '0 4px 6px rgba(0, 0, 0, 0.3)';
                        container.appendChild(vrButton);
                        log('VR disponível - Botão no topo');
                    }
                });
            }

            // Iniciar animação
            renderer.setAnimationLoop(render);
            log('Loop de animação iniciado');
        }

        function createVideoSphere() {
            log('Criando esfera de vídeo...');

            // Criar textura do vídeo
            videoTexture = new THREE.VideoTexture(video);
            videoTexture.minFilter = THREE.LinearFilter;
            videoTexture.magFilter = THREE.LinearFilter;
            videoTexture.generateMipmaps = false;
            videoTexture.colorSpace = THREE.SRGBColorSpace;

            log('Textura criada');

            // Geometria - esfera simples
            const geometry = new THREE.SphereGeometry(100, 32, 32);
            geometry.scale(-1, 1, 1); // Inverte para ver de dentro

            // Material
            const material = new THREE.MeshBasicMaterial({
                map: videoTexture,
                side: THREE.FrontSide
            });

            // Remover mesh anterior se existir
            if (videoMesh) {
                scene.remove(videoMesh);
                videoMesh.geometry.dispose();
                videoMesh.material.dispose();
            }

            // Criar mesh
            videoMesh = new THREE.Mesh(geometry, material);
            scene.add(videoMesh);

            log('Esfera adicionada à cena');

            // Tentar play automático
            setTimeout(() => {
                playVideo();
            }, 100);
        }

        function playVideo() {
            const promise = video.play();
            if (promise !== undefined) {
                promise
                    .then(() => {
                        isPlaying = true;
                        playPauseBtn.textContent = '⏸️ Pause';
                        log('Reproduzindo');
                    })
                    .catch((error) => {
                        log('Autoplay bloqueado: ' + error.message);
                    });
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                video.pause();
                isPlaying = false;
                playPauseBtn.textContent = '▶️ Play';
            } else {
                playVideo();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            video.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇 Mudo' : '🔊 Som';
        }

        function changeVideo() {
            log('Trocando vídeo...');
            video.pause();
            video.src = videoSelect.value;
            video.load();
            isPlaying = false;
            playPauseBtn.textContent = '▶️ Play';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            if (!renderer.xr.isPresenting) {
                controls.update();
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
