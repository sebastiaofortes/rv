<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apresentação VR - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            max-width: 300px;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #vrButton {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #vrButton:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        #slideCounter {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            z-index: 100;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 100;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h3 style="margin-bottom: 10px;">📊 Apresentação VR 360°</h3>
        <p><strong>Controles:</strong></p>
        <p>← → : Navegar slides</p>
        <p>Mouse: Rotacionar e olhar ao redor</p>
        <p>Os slides estão ao seu redor!</p>
    </div>

    <div id="controls">
        <button id="prevBtn" class="btn">← Anterior</button>
        <button id="vrButton" class="btn">🥽 Entrar em VR</button>
        <button id="nextBtn" class="btn">Próximo →</button>
    </div>

    <div id="slideCounter">
        <span id="currentSlide">1</span> / <span id="totalSlides">5</span>
    </div>

    <div id="loading">Carregando...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        // Configuração da cena
        let scene, camera, renderer, cssRenderer, controls;
        let currentSlideIndex = 0;
        let slides = [];
        let room;
        let isAnimating = false;
        let targetRotation = { y: 0 };
        let currentRotation = { y: 0 };

        // Definição dos slides
        const slideData = [
            {
                title: "Bem-vindo à Apresentação VR",
                content: "Explore uma nova forma de\napresentar conteúdo em\nrealidade virtual",
                color: 0x667eea
            },
            {
                title: "Imersão Total",
                content: "Sinta-se presente no\nambiente da apresentação\ncom tecnologia WebXR",
                color: 0x764ba2
            },
            {
                title: "Navegação Intuitiva",
                content: "Use os controles para\nnavegar entre slides\nem 3D",
                color: 0xf093fb
            },
            {
                title: "Vídeo Demonstração",
                content: "",
                color: 0x4facfe,
                youtubeId: "dQw4w9WgXcQ"
            },
            {
                title: "Obrigado!",
                content: "Desenvolvido com Three.js\ne WebXR API\n🚀",
                color: 0x43e97b
            }
        ];

        function init() {
            // Cena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

            // Câmera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1.6, 3);

            // Renderer WebGL
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.domElement.style.position = 'absolute';
            renderer.domElement.style.top = '0';
            document.getElementById('container').appendChild(renderer.domElement);

            // CSS3DRenderer para elementos HTML (YouTube)
            cssRenderer = new CSS3DRenderer();
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.domElement.style.position = 'absolute';
            cssRenderer.domElement.style.top = '0';
            cssRenderer.domElement.style.pointerEvents = 'none'; // Não bloquear controles
            document.getElementById('container').appendChild(cssRenderer.domElement);

            // Controles para desktop
            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.6, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 8;
            controls.minDistance = 1;
            controls.enablePan = false; // Desabilitar pan para manter foco no centro

            // Criar sala
            createRoom();

            // Criar iluminação
            createLights();

            // Criar slides
            createSlides();

            // Botão VR
            const vrButton = VRButton.createButton(renderer);
            document.getElementById('vrButton').addEventListener('click', () => {
                vrButton.click();
            });

            // Event listeners
            setupEventListeners();

            // Mostrar primeiro slide
            showSlide(0);

            // Esconder loading
            document.getElementById('loading').classList.add('hidden');

            // Animar
            renderer.setAnimationLoop(animate);
        }

        function createRoom() {
            // Chão
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a3e,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grid no chão
            const gridHelper = new THREE.GridHelper(20, 20, 0x444466, 0x333344);
            scene.add(gridHelper);

            // Paredes
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0x2a2a3e,
                side: THREE.BackSide,
                roughness: 0.9
            });

            // Parede traseira
            const backWallGeometry = new THREE.PlaneGeometry(20, 10);
            const backWall = new THREE.Mesh(backWallGeometry, wallMaterial);
            backWall.position.z = -10;
            backWall.receiveShadow = true;
            scene.add(backWall);

            // Teto
            const ceilingGeometry = new THREE.PlaneGeometry(20, 20);
            const ceiling = new THREE.Mesh(ceilingGeometry, wallMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 10;
            ceiling.receiveShadow = true;
            scene.add(ceiling);
        }

        function createLights() {
            // Luz ambiente mais intensa para iluminar todos os slides
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            // Luz principal no centro acima do usuário
            const mainLight = new THREE.PointLight(0xffffff, 1, 15);
            mainLight.position.set(0, 5, 0);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            scene.add(mainLight);

            // Luzes ao redor do círculo para iluminar os slides
            const numLights = 6;
            const lightRadius = 8;
            for (let i = 0; i < numLights; i++) {
                const angle = (i / numLights) * Math.PI * 2;
                const x = Math.sin(angle) * lightRadius;
                const z = Math.cos(angle) * lightRadius;
                
                const pointLight = new THREE.PointLight(0xffffff, 0.5, 10);
                pointLight.position.set(x, 3, z);
                scene.add(pointLight);
            }
        }

        function createSlides() {
            const radius = 6; // Raio do círculo de slides
            const angleStep = (Math.PI * 2) / slideData.length;

            slideData.forEach((data, index) => {
                const slideGroup = new THREE.Group();
                
                // Painel do slide
                const panelGeometry = new THREE.BoxGeometry(6, 4, 0.1);
                const panelMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.3,
                    metalness: 0.1
                });
                const panel = new THREE.Mesh(panelGeometry, panelMaterial);
                panel.castShadow = true;
                panel.receiveShadow = true;
                slideGroup.add(panel);

                // Borda colorida
                const borderGeometry = new THREE.BoxGeometry(6.2, 4.2, 0.05);
                const borderMaterial = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.2,
                    metalness: 0.5,
                    emissive: data.color,
                    emissiveIntensity: 0.3
                });
                const border = new THREE.Mesh(borderGeometry, borderMaterial);
                border.position.z = -0.08;
                slideGroup.add(border);

                // Se tem vídeo do YouTube
                if (data.youtubeId) {
                    // Criar iframe do YouTube
                    const iframe = document.createElement('iframe');
                    iframe.style.width = '1280px';
                    iframe.style.height = '720px';
                    iframe.style.border = '0px';
                    iframe.style.pointerEvents = 'auto'; // Permitir interação com o vídeo
                    iframe.src = `https://www.youtube.com/embed/${data.youtubeId}?autoplay=0&controls=1&rel=0&modestbranding=1&fs=1&enablejsapi=1`;
                    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                    iframe.allowFullscreen = true;
                    
                    const cssObject = new CSS3DObject(iframe);
                    cssObject.scale.set(0.0046, 0.0046, 0.0046); // Escalar para caber no slide
                    cssObject.position.z = 0.06;
                    slideGroup.add(cssObject);
                    
                    // Adicionar título acima do vídeo (canvas pequeno)
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024;
                    canvas.height = 200;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = '#' + data.color.toString(16).padStart(6, '0');
                    ctx.font = 'bold 60px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(data.title, canvas.width / 2, 120);
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    texture.minFilter = THREE.LinearFilter;
                    texture.magFilter = THREE.LinearFilter;
                    
                    const titleMaterial = new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true
                    });
                    const titleMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(5.9, 0.98),
                        titleMaterial
                    );
                    titleMesh.position.set(0, 1.5, 0.061);
                    slideGroup.add(titleMesh);
                } else {
                    // Canvas para texto (slide normal)
                    const canvas = document.createElement('canvas');
                    canvas.width = 1024;
                    canvas.height = 768;
                    const ctx = canvas.getContext('2d');

                    // Fundo
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Título
                    ctx.fillStyle = '#' + data.color.toString(16).padStart(6, '0');
                    ctx.font = 'bold 72px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(data.title, canvas.width / 2, 150);

                    // Linha decorativa
                    ctx.strokeStyle = '#' + data.color.toString(16).padStart(6, '0');
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(200, 200);
                    ctx.lineTo(canvas.width - 200, 200);
                    ctx.stroke();

                    // Conteúdo
                    ctx.fillStyle = '#333333';
                    ctx.font = '48px Arial';
                    const lines = data.content.split('\n');
                    lines.forEach((line, i) => {
                        ctx.fillText(line, canvas.width / 2, 320 + i * 70);
                    });

                    // Textura do canvas
                    const texture = new THREE.CanvasTexture(canvas);
                    texture.minFilter = THREE.LinearFilter;
                    texture.magFilter = THREE.LinearFilter;

                    // Aplicar textura (o texto fica NA FRENTE do painel branco)
                    const textMaterial = new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true
                    });
                    const textMesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(5.9, 3.9),
                        textMaterial
                    );
                    textMesh.position.z = 0.06; // Na frente do painel
                    slideGroup.add(textMesh);
                }

                // Posicionar slide em círculo ao redor do usuário
                const angle = index * angleStep;
                const x = Math.sin(angle) * radius;
                const z = Math.cos(angle) * radius;
                
                slideGroup.position.set(x, 1.6, z);
                
                // Fazer o slide olhar para o centro (usuário)
                const lookVector = new THREE.Vector3(0, 1.6, 0);
                slideGroup.lookAt(lookVector);
                
                // Armazenar o ângulo original do slide
                slideGroup.userData.angle = angle;
                slideGroup.userData.index = index;
                slideGroup.userData.originalEmissive = 0.3;

                slides.push(slideGroup);
                scene.add(slideGroup);
            });

            document.getElementById('totalSlides').textContent = slides.length;
        }

        function showSlide(index) {
            if (index < 0 || index >= slides.length) return;

            currentSlideIndex = index;
            
            // Resetar todos os slides para opacidade normal
            slides.forEach((slide, i) => {
                const border = slide.children[1]; // A borda é o segundo filho
                
                if (i === index) {
                    // Destacar slide atual
                    border.material.emissiveIntensity = 0.7;
                    slide.scale.set(1.1, 1.1, 1.1);
                } else {
                    // Slides inativos ficam mais escuros
                    border.material.emissiveIntensity = 0.1;
                    slide.scale.set(1, 1, 1);
                }
            });

            // Animar rotação da câmera para o slide
            const targetSlide = slides[index];
            const targetAngle = targetSlide.userData.angle;
            
            // Calcular a rotação alvo (girar para olhar para o slide)
            targetRotation.y = targetAngle;
            
            // Animar suavemente
            if (!renderer.xr.isPresenting) {
                isAnimating = true;
                const startTime = performance.now();
                const duration = 1000;
                const startRotation = currentRotation.y;
                
                // Calcular o caminho mais curto de rotação
                let angleDiff = targetRotation.y - startRotation;
                if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                
                function animateCamera() {
                    const elapsed = performance.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = easeInOutCubic(progress);
                    
                    currentRotation.y = startRotation + angleDiff * eased;
                    
                    // Atualizar posição da câmera
                    const distance = 3;
                    camera.position.x = Math.sin(currentRotation.y) * distance;
                    camera.position.z = Math.cos(currentRotation.y) * distance;
                    camera.position.y = 1.6;
                    
                    // Fazer a câmera olhar para o slide
                    camera.lookAt(targetSlide.position);
                    
                    if (progress < 1) {
                        requestAnimationFrame(animateCamera);
                    } else {
                        isAnimating = false;
                    }
                }
                animateCamera();
            }

            // Atualizar UI
            document.getElementById('currentSlide').textContent = index + 1;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === slides.length - 1;
        }
        
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        function nextSlide() {
            if (currentSlideIndex < slides.length - 1) {
                showSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                showSlide(currentSlideIndex - 1);
            }
        }

        function setupEventListeners() {
            // Botões
            document.getElementById('nextBtn').addEventListener('click', nextSlide);
            document.getElementById('prevBtn').addEventListener('click', prevSlide);

            // Teclado
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            });

            // Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                cssRenderer.setSize(window.innerWidth, window.innerHeight);
            });

            // VR Controllers
            const controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', nextSlide);
            scene.add(controller1);

            const controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', prevSlide);
            scene.add(controller2);

            // Raio visual para controllers
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 0, -1)
            ]);
            const line = new THREE.Line(geometry);
            line.scale.z = 5;
            controller1.add(line.clone());
            controller2.add(line.clone());
        }

        function animate() {
            // Atualizar controles (apenas fora do VR)
            if (!renderer.xr.isPresenting) {
                controls.update();
            }

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }

        // Inicializar quando a página carregar
        init();
    </script>
</body>
</html>
