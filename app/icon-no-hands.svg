<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Meditation person with VR headset -->
  <g transform="translate(256, 256)">
    
    <!-- Outer meditation aura/glow -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
    <circle cx="0" cy="0" r="200" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>
    
    <!-- Head -->
    <ellipse cx="0" cy="-65" rx="38" ry="42" fill="#ffffff"/>
    
    <!-- VR Headset/Goggles -->
    <rect x="-52" y="-75" width="104" height="38" rx="19" fill="#1e1b4b" opacity="0.9"/>
    
    <!-- Goggles lenses shine -->
    <ellipse cx="-22" cy="-60" rx="18" ry="15" fill="#667eea" opacity="0.8"/>
    <ellipse cx="22" cy="-60" rx="18" ry="15" fill="#667eea" opacity="0.8"/>
    
    <!-- Lens highlights -->
    <ellipse cx="-26" cy="-64" rx="6" ry="5" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="18" cy="-64" rx="6" ry="5" fill="#ffffff" opacity="0.6"/>
    
    <!-- Headset strap -->
    <path d="M -52 -56 Q -70 -65, -70 -80 Q -70 -90, -50 -95" 
          stroke="#1e1b4b" stroke-width="8" fill="none" opacity="0.7" stroke-linecap="round"/>
    <path d="M 52 -56 Q 70 -65, 70 -80 Q 70 -90, 50 -95" 
          stroke="#1e1b4b" stroke-width="8" fill="none" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Neck -->
    <rect x="-12" y="-20" width="24" height="18" rx="6" fill="#ffffff"/>
    
    <!-- Body/Torso -->
    <ellipse cx="0" cy="20" rx="48" ry="55" fill="#ffffff"/>
    
    <!-- Arms in meditation pose (extended) - SIMPLIFIED -->
    <!-- Left arm -->
    <path d="M -42 10 C -85 25, -115 55, -105 75" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Right arm -->
    <path d="M 42 10 C 85 25, 115 55, 105 75" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Legs in lotus position -->
    <!-- Left leg -->
    <ellipse cx="-55" cy="100" rx="60" ry="22" fill="#ffffff" transform="rotate(-8 -55 100)"/>
    
    <!-- Right leg -->
    <ellipse cx="55" cy="100" rx="60" ry="22" fill="#ffffff" transform="rotate(8 55 100)"/>
    
    <!-- Shadow/ground base -->
    <ellipse cx="0" cy="115" rx="110" ry="18" fill="#1e1b4b" opacity="0.12"/>
    
  </g>
</svg>

